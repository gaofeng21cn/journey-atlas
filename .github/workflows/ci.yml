name: Validate Journey Atlas

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable-workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run package:check
      - run: npm run init:data
      - run: npm run import:data -- --input examples/import-bundle.json
      - run: npm run build -- --variant social
      - run: npm run verify
