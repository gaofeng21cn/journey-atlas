name: Validate Journey Atlas

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable-workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plugins/travel-passport/package-lock.json
      - run: npm --prefix plugins/travel-passport ci
      - run: npm --prefix plugins/travel-passport exec -- playwright install --with-deps chromium
      - run: npm test
      - run: npm run package:check
      - run: npm run verify:installed
      - run: npm run init:data
      - run: mkdir -p examples && cp plugins/travel-passport/examples/source-note.md examples/source-note.md
      - run: npm run import:data -- --input plugins/travel-passport/examples/import-bundle.json
      - run: npm run build -- --variant social
      - run: npm run verify
